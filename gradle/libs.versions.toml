[versions]
kotlin = "2.4.10"
# The current release, and it stays there. A test-only tool does not get to choose the Compose line
# the library publishes against - when viddik could not run on 1.12.0 the answer was to wait for
# viddik, not to ship against 1.11.1. See B-23, closed.
compose-multiplatform = "1.12.0"
# KSP is versioned independently of the Kotlin compiler since KSP2; viddik's processor runs on it.
ksp = "2.3.10"
# viddik ships the plugin, the annotations and the capture engine under one version, which is what
# keeps the processor and the renderer in step.
viddik = "0.2.0.14"
# The Gradle plugin and the ktlint it runs are separate versions on purpose: the plugin is a
# launcher, the CLI is what decides how the code looks.
ktlint = "1.8.0"
ktlintPlugin = "14.2.0"
agp = "9.3.2"
# compileSdk is the API the library is compiled against; minSdk is what it runs on.
# 37 is not a choice: `androidx.compose.animation:animation-core-android:1.12.0` carries AAR
# metadata demanding it, and 36 fails the build with eight of those before a line is compiled.
# 24 is where `FontVariation` stops needing a fallback, and Metro's own hardware is far below
# anything current anyway.
android-compileSdk = "37"
android-minSdk = "24"
activityCompose = "1.11.0"
# The one place a Material version is allowed to be written down (research §1.2, consequence 4).
#
# `org.jetbrains.compose.material3:material3:1.12.0-alpha03` resolves to **Jetpack
# `androidx.compose.material3:material3:1.5.0-alpha22`**, which is the pair CMP 1.12.0 releases
# itself with. The alternative was `material3:1.9.0` on Jetpack M3 1.4.0 stable — both render and
# both carry the ripple switch, so the choice fell to which failure is cheaper: that one is a mixed
# graph and fails at runtime in a consumer's application, this one is an alpha API and fails at
# compile time here. Research §1.2.
#
# Alpha, so **expect this to need re-checking** rather than to hold: Jetpack M3 1.5 has been in
# alpha long enough to reach alpha26, and the ripple corner is exactly what is being reshaped.
composeMaterial3 = "1.12.0-alpha03"
# Test-only, to read the vendored token dump. Matches the core already on the Compose graph.
kotlinxSerialization = "1.7.3"

[libraries]
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
# On-device tests only. B-29: viddik's capture engine is JVM-only, so Android's guard has to be a
# number measured on a real renderer rather than a golden, and that needs the instrumentation runner.
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
# Compose's Android test infrastructure calls Espresso's idling, and 3.5.0 - the version
# `compose.uiTest` still drags in - reaches for `InputManager.getInstance`, which Android 17 removed.
# The test dies before it renders anything, with a NoSuchMethodException that names neither Compose
# nor this library. Pinned forward here rather than excluded, because the idling is wanted.
androidx-test-espresso = { module = "androidx.test.espresso:espresso-core", version = "3.7.0" }
# `runComposeUiTest` launches an activity, and on Android nothing declares one unless this is on the
# classpath: it is a manifest containing `androidx.activity.ComponentActivity` and nothing else.
# Without it the test fails at "Unable to resolve activity", which names neither Compose nor a
# missing dependency. Pinned to the AndroidX line CMP 1.12.0 ships against.
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version = "1.12.0" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
viddik = { id = "ru.workinprogress.viddik", version.ref = "viddik" }
# A KMP library takes AGP's multiplatform plugin, not `com.android.library`: the latter wants to own
# the module's source sets, and in a KMP module Kotlin already does.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
