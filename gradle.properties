org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official

# The published version, in one place because it is written in more than one: the README's
# dependency snippet quotes it, and the publish workflow compares it against the tag.
# `scripts/version_guard.py` holds the README to it, and is in `make check`.
#
# Named `version` rather than `kvadrant.version` since the build went onto the shared conventions:
# it is the PROJECT's version now, which is what the archive tasks read for their file names. A
# publication carrying one number while the files are named after another resolves and arrives
# misnamed, which is indistinguishable from a good publish on this side.
version=0.1.0

# WHAT THE SHARED CONVENTIONS READ (`ru.workinprogress.sborka`).
sborka.group=io.github.youndie
sborka.repository=youndie/kvadrant-ui
sborka.description=A Metro (Windows Phone 8) component library for Compose Multiplatform.
sborka.inceptionYear=2026
sborka.licence=The Apache License, Version 2.0

# 25 for both. The floor is the same number rather than a lower one because that is what this
# library is compiled to today, and lowering it would be a promise to consumers on older JVMs that
# nothing here has ever been built to keep. What IS new is that the number is now stated in the
# published metadata: until this migration a multiplatform module published its jvm variant with no
# `org.gradle.jvm.version` at all, so a consumer on 17 resolved it, compiled against it, and met
# UnsupportedClassVersionError at class loading — a message about a bytecode version with nothing in
# it about this library.
sborka.jvmToolchain=25
sborka.jvmFloor=25

# PREFER_PROJECT, which is what this build had before the conventions set a mode at all, and the
# `wasmJs` target is the whole reason. The Kotlin plugin declares repositories ON THE PROJECT for
# three things it downloads — Node, Yarn and Binaryen — so the two stricter modes each break it:
# FAIL_ON_PROJECT_REPOS refuses the build over a repository nobody in it wrote ("added by unknown
# code"), and PREFER_SETTINGS ignores them, which surfaces as `Could not find org.nodejs:node:25.0.0`
# and then `Could not find com.github.webassembly:binaryen:125` — each reading as a missing artefact
# rather than as a repository that was overridden.
#
# Declaring those three in settings instead would mean copying an ivy layout that belongs to the
# Kotlin plugin and changes with it; the failure when it drifts is the same misleading one. Nothing
# in this repository declares a repository of its own, so what this mode gives up is a guard against
# something that is not happening.
sborka.repositoriesMode=PREFER_PROJECT
