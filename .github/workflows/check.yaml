# From docs-bootstrap's templates/workflow-check.yaml, for the default layout - `docs/` inside this
# repository - with this repository's code gate beside it. The Makefile at the root is its other half.
#
# THE VERSION OF THE CHECKS IS WRITTEN HERE AND NOWHERE ELSE: the ref in the `uses:` lines below.
# CI runs the checks at that ref because the runner resolves it; the Makefile reads the same line
# and fetches the same ref for a local `make check`. Renovate's github-actions manager bumps it, so a
# release of the checks arrives as one pull request that moves CI and every laptop together. Both
# jobs name the same ref, and the Makefile refuses to guess when they do not.
#
# Do not replace the action with copied scripts to save a network fetch. That is how one portfolio
# came to hold 18 copies of one script in three versions, eleven of them missing a guard that had
# been fixed upstream for weeks.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. The action runs `make check` - exactly the target a contributor runs, so that "green
  # here, red there" cannot become the normal state of affairs - and around it the two checks that
  # depend on the event: on a pull request, backlog item numbers against the base branch, BEFORE the
  # gate; on a push to the default branch, `status: draft` as an error. Why each sits where it does,
  # and when the first is only a backstop, is written next to the step in the action's action.yml.
  #
  # Checks of the project's own belong in the Makefile under `gate`, not as steps here: then a
  # contributor runs them too. Steps that need a toolchain the gate should not (a JDK for a
  # formatter) go after this one, or in a job of their own.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: youndie/docs-bootstrap@v0.3.5

  # The code gate. It was missing entirely: this workflow ran `make check` and nothing else, so the
  # tests, ktlint, the screenshot suite, the ABI dump and `noMaterialInTheCore` all lived on one
  # laptop. A guard that runs in one place reports on whichever branch its owner happens to be
  # standing on.
  #
  # **macOS, and this is B-35's answer rather than a preference.**
  #
  # The desktop test suite is a *rendering* suite: it photographs components and it counts ink
  # pixels. macOS and FreeType assign different values to the pixels at a glyph's edge — measured,
  # with every glyph's bounding box identical to the pixel on both, so it is the edges and nothing
  # else — and that difference reaches the suite twice over. It moves the goldens (34 of them differ
  # at viddik's channel tolerance, and no tolerance closes the gap without also admitting a real
  # regression), and it moves the calibration tests, which pick the Cyrillic companion's weight by
  # comparing ink coverage across candidates ten apart.
  #
  # Neither half can be recalibrated for two rasterisers at once. So the suite runs on the one its
  # numbers came from. What is given up is Linux as a second environment, which for a library with
  # no native targets was buying a JVM that is already portable; what is bought back is a gate at
  # full strength rather than a permanently red one, and a red build people stop reading is not a
  # gate at all.
  #
  # No `xvfb-run`: the tests render offscreen and there is no X server here to emulate.
  gradle:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Java and Gradle in one step and at one version for the portfolio: the action installs 21
      # and 25 and leaves 25 the default, which is sborka's default toolchain.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      # `check` shells out to python3 three times — the token and icon generators compare a
      # committed file against its source, and the component catalogue checks itself against the
      # preview registry. The runner ships a python3, so this step buys a *declared* version rather
      # than a working build; an undeclared interpreter changes under you without a diff.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The same one target a contributor runs, unsplit. `check` carries the tests, ktlint,
      # `viddikVerify`, `checkKotlinAbi`, `noMaterialInTheCore` and the three generator checks;
      # naming them separately here is how the CI set and the local set start to differ. An earlier
      # version of this file excluded `viddikVerify` so the rest could stay on Linux, and that only
      # moved the problem: the calibration tests count ink pixels and fail there too.
      #
      # `connectedAndroidDeviceTest` is deliberately absent: it needs a phone, and B-29 records that
      # a green `check` says nothing at all about Android.
      - run: ./gradlew check --no-daemon

      # The diffs and the reports. viddik writes a `*_DIFF.png` beside every mismatch and names it
      # in the failure message; without this that sentence points at a path on a machine that no
      # longer exists, and a reader is left with a percentage. A screenshot defect is one that can
      # only be looked at.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            **/build/reports/screenshots/**
            **/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  # Separate from the gate, and on a schedule rather than on a pull request, because an anchor rots
  # when somebody refactors a **different** repository. A pull request here is the least likely
  # moment for one to break, and running it there trains people to ignore a red build they did not
  # cause. It also does not block: a path quoted *as obsolete* is indistinguishable from a live one
  # by machine, so the report is read by a person. Pass `target: report ANCHORS_ARGS=--check` once
  # the stale list reaches zero.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The code lives in this checkout, so its parent is a directory whose one subdirectory is
      # this repository - which is exactly what REPOS (`..` by default) expects.
      - uses: youndie/docs-bootstrap@v0.3.5
        with:
          target: report

      # For a separate documentation repository, put shallow clones of the services next to the
      # step above and point REPOS at them. History is not needed - only the file tree - and a
      # repository that cannot be cloned is a warning rather than a failure, because its anchors are
      # simply unchecked.
      #
      # `secrets.GITHUB_TOKEN` is scoped to the repository running the workflow. That is enough for
      # public services; a private one needs a token that can read it, and with the default one it
      # will take the warning branch every week without ever saying why.
      #
      #   - run: |
      #       mkdir -p repos && cd repos
      #       for r in service-one service-two; do
      #         git clone --depth 1 --filter=blob:none --no-checkout \
      #           "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/$r.git" \
      #           || echo "::warning::$r is unreachable - its anchors were not checked"
      #       done
      #     env:
      #       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   - uses: youndie/docs-bootstrap@v0.3.5
      #     with:
      #       target: report REPOS=repos
