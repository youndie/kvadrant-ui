<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="1240" height="880" font-family="Segoe UI, Selawik, Inter, sans-serif">
  <rect width="1240" height="880" fill="#0A0A0A"/>
  <text x="20" y="38" fill="#FFFFFF" font-size="30" font-weight="300">Моушн: кривые и tilt-эффект</text>
  <text x="20" y="60" fill="#99FFFFFF" font-size="13">Значения извлечены из WinJS Animations.js и Windows Phone Toolkit (TiltEffect.cs) — не из документации, MSDN их не публиковал.</text>

  <text x="60" y="102" fill="#1BA1E2" font-size="17" font-weight="600">КРИВЫЕ УСКОРЕНИЯ</text>

  <!-- box 1 -->
  <g>
    <rect x="60" y="140" width="180" height="180" fill="#111111" stroke="#33FFFFFF"/>
    <line x1="60" y1="320" x2="240" y2="140" stroke="#2EFFFFFF" stroke-dasharray="3 3"/>
    <path d="M60,320 C78,158 96,140 240,140" fill="none" stroke="#1BA1E2" stroke-width="2.5"/>
    <text x="60" y="342" fill="#FFFFFF" font-size="14" font-weight="600">cubic-bezier(0.1, 0.9, 0.2, 1)</text>
    <text x="60" y="362" fill="#99FFFFFF" font-size="12">Основная кривая Metro</text>
    <text x="60" y="380" fill="#66FFFFFF" font-size="12">≈ 80 % всей библиотеки WinJS:</text>
    <text x="60" y="396" fill="#66FFFFFF" font-size="12">pointerDown/Up, enterContent,</text>
    <text x="60" y="412" fill="#66FFFFFF" font-size="12">showPanel, showPopup, EdgeUI</text>
  </g>

  <!-- box 2 -->
  <g>
    <rect x="300" y="140" width="180" height="180" fill="#111111" stroke="#33FFFFFF"/>
    <line x1="300" y1="320" x2="480" y2="140" stroke="#2EFFFFFF" stroke-dasharray="3 3"/>
    <path d="M300,320 C368.85,319.55 457.95,339.35 480,140" fill="none" stroke="#E51400" stroke-width="2.5"/>
    <text x="300" y="342" fill="#FFFFFF" font-size="13" font-weight="600">(0.3825, 0.0025, 0.8775, −0.1075)</text>
    <text x="300" y="362" fill="#99FFFFFF" font-size="12">Уход со сцены (exit)</text>
    <text x="300" y="380" fill="#66FFFFFF" font-size="12">Отрицательный y2 даёт лёгкий</text>
    <text x="300" y="396" fill="#66FFFFFF" font-size="12">«подсос» назад перед уходом.</text>
    <text x="300" y="412" fill="#66FFFFFF" font-size="12">continuumForwardOut</text>
  </g>

  <!-- box 3 -->
  <g>
    <rect x="540" y="140" width="180" height="180" fill="#111111" stroke="#33FFFFFF"/>
    <line x1="540" y1="320" x2="720" y2="140" stroke="#2EFFFFFF" stroke-dasharray="3 3"/>
    <path d="M540,320 C570.6,177.8 578.7,139.55 720,140" fill="none" stroke="#60A917" stroke-width="2.5"/>
    <text x="540" y="342" fill="#FFFFFF" font-size="13" font-weight="600">(0.17, 0.79, 0.215, 1.0025)</text>
    <text x="540" y="362" fill="#99FFFFFF" font-size="12">Slide-in с микро-овершутом</text>
    <text x="540" y="380" fill="#66FFFFFF" font-size="12">y2 &gt; 1 — перелёт на 0.25 %,</text>
    <text x="540" y="396" fill="#66FFFFFF" font-size="12">глазом не ловится, но даёт</text>
    <text x="540" y="412" fill="#66FFFFFF" font-size="12">ощущение «живого» движения</text>
  </g>

  <!-- box 4 -->
  <g>
    <rect x="780" y="140" width="180" height="180" fill="#111111" stroke="#33FFFFFF"/>
    <line x1="780" y1="320" x2="960" y2="140" stroke="#2EFFFFFF" stroke-dasharray="3 3"/>
    <polyline points="780,320 798,238.6 816,193.9 834,169.4 852,155.9 870,148.5 888,144.5 906,142.3 924,141.0 942,140.4 960,140"
              fill="none" stroke="#F0A30A" stroke-width="2.5"/>
    <text x="780" y="342" fill="#FFFFFF" font-size="13" font-weight="600">ExponentialEase EaseOut, Exp = 6</text>
    <text x="780" y="362" fill="#99FFFFFF" font-size="12">Канон Windows Phone</text>
    <text x="780" y="380" fill="#66FFFFFF" font-size="12" font-family="monospace">f(t) = (1 − e^(−6t)) / (1 − e^(−6))</text>
    <text x="780" y="398" fill="#66FFFFFF" font-size="12">Прямого cubic-bezier-эквивалента</text>
    <text x="780" y="414" fill="#66FFFFFF" font-size="12">нет — писать как Easing { }</text>
  </g>

  <!-- durations table -->
  <rect x="1000" y="140" width="220" height="280" fill="#111111" stroke="#33FFFFFF"/>
  <text x="1014" y="164" fill="#FFFFFF" font-size="14" font-weight="600">Опорные длительности</text>
  <text x="1014" y="190" fill="#99FFFFFF" font-size="12">fadeIn</text><text x="1180" y="190" fill="#FFFFFF" font-size="12" text-anchor="end">250 ms</text>
  <text x="1014" y="210" fill="#99FFFFFF" font-size="12">fadeOut</text><text x="1180" y="210" fill="#FFFFFF" font-size="12" text-anchor="end">167 ms</text>
  <text x="1014" y="230" fill="#99FFFFFF" font-size="12">pointerDown / Up</text><text x="1180" y="230" fill="#FFFFFF" font-size="12" text-anchor="end">167 ms</text>
  <text x="1014" y="250" fill="#99FFFFFF" font-size="12">enterContent</text><text x="1180" y="250" fill="#FFFFFF" font-size="12" text-anchor="end">550 ms</text>
  <text x="1014" y="270" fill="#99FFFFFF" font-size="12">enterPage</text><text x="1180" y="270" fill="#FFFFFF" font-size="12" text-anchor="end">1000 ms</text>
  <text x="1014" y="290" fill="#99FFFFFF" font-size="12">reposition</text><text x="1180" y="290" fill="#FFFFFF" font-size="12" text-anchor="end">367 ms</text>
  <text x="1014" y="310" fill="#99FFFFFF" font-size="12">showPanel</text><text x="1180" y="310" fill="#FFFFFF" font-size="12" text-anchor="end">550 ms</text>
  <text x="1014" y="336" fill="#66FFFFFF" font-size="11">— WP Toolkit —</text>
  <text x="1014" y="356" fill="#99FFFFFF" font-size="12">Turnstile In / Out</text><text x="1180" y="356" fill="#FFFFFF" font-size="12" text-anchor="end">350 / 250</text>
  <text x="1014" y="376" fill="#99FFFFFF" font-size="12">Slide In / Out</text><text x="1180" y="376" fill="#FFFFFF" font-size="12" text-anchor="end">500 / 300</text>
  <text x="1014" y="396" fill="#99FFFFFF" font-size="12">Rotate (все режимы)</text><text x="1180" y="396" fill="#FFFFFF" font-size="12" text-anchor="end">250 ms</text>
  <text x="1014" y="414" fill="#99FFFFFF" font-size="12">Roll (2 фазы)</text><text x="1180" y="414" fill="#FFFFFF" font-size="12" text-anchor="end">600 ms</text>

  <!-- ================== TILT ================== -->
  <line x1="60" y1="450" x2="1220" y2="450" stroke="#33FFFFFF"/>
  <text x="60" y="486" fill="#1BA1E2" font-size="17" font-weight="600">TILT EFFECT — геометрия (TiltEffect.cs)</text>

  <!-- tile with touch points -->
  <rect x="60" y="510" width="300" height="300" fill="#1F1F1F" stroke="#4DFFFFFF"/>
  <line x1="210" y1="510" x2="210" y2="810" stroke="#33FFFFFF" stroke-dasharray="4 4"/>
  <line x1="60" y1="660" x2="360" y2="660" stroke="#33FFFFFF" stroke-dasharray="4 4"/>

  <circle cx="210" cy="660" r="10" fill="#60A917"/>
  <text x="226" y="656" fill="#60A917" font-size="12">центр: угол 0°</text>
  <text x="226" y="672" fill="#60A917" font-size="12">утапливание 25 px (максимум)</text>

  <circle cx="90" cy="540" r="10" fill="#E51400"/>
  <text x="106" y="536" fill="#E51400" font-size="12">угол: 17.19° (максимум)</text>
  <text x="106" y="552" fill="#E51400" font-size="12">утапливание 0 px</text>

  <circle cx="330" cy="740" r="10" fill="#F0A30A"/>
  <text x="200" y="768" fill="#F0A30A" font-size="12">противоположный угол —</text>
  <text x="200" y="784" fill="#F0A30A" font-size="12">зеркальный наклон</text>

  <text x="60" y="836" fill="#66FFFFFF" font-size="12">nx, ny — нормализованные координаты касания (0…1) внутри элемента</text>

  <!-- formula panel -->
  <rect x="400" y="510" width="440" height="300" fill="#111111" stroke="#33FFFFFF"/>
  <text x="416" y="536" fill="#FFFFFF" font-size="14" font-weight="600">Формулы (дословно из исходника)</text>
  <text x="416" y="566" fill="#1BA1E2" font-size="13" font-family="monospace">MaxAngle      = 0.3 рад = 17.188°</text>
  <text x="416" y="586" fill="#1BA1E2" font-size="13" font-family="monospace">MaxDepression = 25 px</text>
  <text x="416" y="606" fill="#1BA1E2" font-size="13" font-family="monospace">ReturnDelay   = 200 ms</text>
  <text x="416" y="626" fill="#1BA1E2" font-size="13" font-family="monospace">ReturnDuration = 100 ms</text>
  <line x1="416" y1="640" x2="824" y2="640" stroke="#33FFFFFF"/>
  <text x="416" y="664" fill="#FFFFFF" font-size="13" font-family="monospace">m = |nx − 0.5| + |ny − 0.5|</text>
  <text x="416" y="684" fill="#FFFFFF" font-size="13" font-family="monospace">angle = m × 0.3 рад</text>
  <text x="416" y="704" fill="#FFFFFF" font-size="13" font-family="monospace">depression = (1 − m) × 25</text>
  <text x="416" y="724" fill="#FFFFFF" font-size="13" font-family="monospace">rotY = angle × xContrib × −sign(nx−0.5)</text>
  <text x="416" y="744" fill="#FFFFFF" font-size="13" font-family="monospace">rotX = angle × (1−xContrib) × sign(ny−0.5)</text>
  <text x="416" y="764" fill="#FFFFFF" font-size="13" font-family="monospace">offsetZ = −depression</text>
  <text x="416" y="792" fill="#66FFFFFF" font-size="12">Чем ближе к центру — тем сильнее «проваливается» и меньше наклон.</text>

  <!-- gotchas -->
  <rect x="880" y="510" width="340" height="300" fill="#111111" stroke="#E51400"/>
  <text x="896" y="536" fill="#E51400" font-size="14" font-weight="600">Что воспроизводят неверно</text>
  <text x="896" y="564" fill="#FFFFFF" font-size="12" font-weight="600">1. Нажатие вниз не анимируется.</text>
  <text x="896" y="582" fill="#99FFFFFF" font-size="12">Свойства ставятся мгновенно на каждом</text>
  <text x="896" y="598" fill="#99FFFFFF" font-size="12">ManipulationDelta. Анимируется только</text>
  <text x="896" y="614" fill="#99FFFFFF" font-size="12">возврат: 3 × DoubleAnimation → 0.</text>
  <text x="896" y="642" fill="#FFFFFF" font-size="12" font-weight="600">2. Scale не используется вообще.</text>
  <text x="896" y="660" fill="#99FFFFFF" font-size="12">Только PlaneProjection. Ощущение</text>
  <text x="896" y="676" fill="#99FFFFFF" font-size="12">«утапливания» даёт перспектива.</text>
  <text x="896" y="704" fill="#FFFFFF" font-size="12" font-weight="600">3. В Compose translationZ не даёт</text>
  <text x="896" y="720" fill="#99FFFFFF" font-size="12">перспективного уменьшения — эмулируем</text>
  <text x="896" y="736" fill="#99FFFFFF" font-size="12">масштабом. При cameraDistance = 8×density</text>
  <text x="896" y="752" fill="#99FFFFFF" font-size="12">формула перспективы даёт ≈ 0.975 —</text>
  <text x="896" y="768" fill="#60A917" font-size="12">в точности scale из WinJS pointerDown.</text>
  <text x="896" y="794" fill="#66FFFFFF" font-size="12">CacheMode = BitmapCache на время наклона.</text>

  <text x="60" y="866" fill="#66FFFFFF" font-size="12">ProgressBar indeterminate: 5 прямоугольников 4 &#215; 4 px (не круги), цикл 4.4 с, BeginTime 0 / 0.2 / 0.4 / 0.6 / 0.8 с, кейфреймы X: 0 % → 33 % (0.5 с) → 66 % (2.0 с) → 100 % (2.5 с).</text>
</svg>
