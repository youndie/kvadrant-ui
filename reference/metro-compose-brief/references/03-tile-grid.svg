<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" width="1220" height="640" font-family="Segoe UI, Selawik, Inter, sans-serif">
  <rect width="1220" height="640" fill="#000000"/>
  <text x="20" y="38" fill="#FFFFFF" font-size="30" font-weight="300">Сетка плиток — 1:1 в логических пикселях</text>
  <text x="20" y="60" fill="#99FFFFFF" font-size="13">Слева Windows Phone 8 (зазор 12 px), справа Windows 8.1 (зазор 10 px @100%). Размеры и зазоры соблюдены точно.</text>

  <!-- ============ WP8 ============ -->
  <text x="40" y="96" fill="#1BA1E2" font-size="17" font-weight="600">WINDOWS PHONE 8 — логические px</text>

  <!-- 4 small = 1 medium footprint -->
  <rect x="40"  y="120" width="99" height="99" fill="#1BA1E2"/>
  <rect x="151" y="120" width="99" height="99" fill="#00ABA9"/>
  <rect x="40"  y="231" width="99" height="99" fill="#60A917"/>
  <rect x="151" y="231" width="99" height="99" fill="#E51400"/>
  <text x="52" y="150" fill="#FFFFFF" font-size="13" font-weight="600">small</text>
  <text x="52" y="168" fill="#FFFFFF" font-size="12" opacity="0.8">99 &#215; 99</text>
  <text x="52" y="186" fill="#FFFFFF" font-size="11" opacity="0.65">asset 159&#215;159</text>

  <!-- medium -->
  <rect x="262" y="120" width="210" height="210" fill="#6A00FF"/>
  <text x="276" y="150" fill="#FFFFFF" font-size="15" font-weight="600">medium</text>
  <text x="276" y="172" fill="#FFFFFF" font-size="13" opacity="0.8">210 &#215; 210 · asset 336&#215;336</text>
  <text x="276" y="192" fill="#FFFFFF" font-size="12" opacity="0.65">= 99 + 12 + 99</text>
  <text x="276" y="212" fill="#FFFFFF" font-size="12" opacity="0.65">padding ассета 101</text>
  <text x="276" y="318" fill="#FFFFFF" font-size="12" opacity="0.8">Title &#8804; 19 символов</text>

  <!-- wide -->
  <rect x="40" y="342" width="432" height="210" fill="#F0A30A"/>
  <text x="54" y="374" fill="#FFFFFF" font-size="15" font-weight="600">wide</text>
  <text x="54" y="396" fill="#FFFFFF" font-size="13" opacity="0.85">432 &#215; 210 · asset 691&#215;336</text>
  <text x="54" y="416" fill="#FFFFFF" font-size="12" opacity="0.7">= 210 + 12 + 210 по ширине</text>
  <text x="54" y="436" fill="#FFFFFF" font-size="12" opacity="0.7">padding ассета 279 &#215; 101</text>
  <text x="54" y="540" fill="#FFFFFF" font-size="12" opacity="0.85">Title &#8804; 39 · BackContent 3&#215;27</text>

  <!-- gap markers -->
  <line x1="139" y1="112" x2="151" y2="112" stroke="#E51400" stroke-width="2"/>
  <text x="122" y="108" fill="#E51400" font-size="11">12</text>

  <text x="40" y="578" fill="#66FFFFFF" font-size="12">Ассеты авторятся только в WXGA; ОС масштабирует: WXGA &#215;1.6, 720p &#215;1.5.</text>
  <text x="40" y="596" fill="#66FFFFFF" font-size="12">Зазор 12 px выведен арифметически: 99+12+99=210, 210+12+210=432. WP7 имел один размер — 173&#215;173.</text>
  <text x="40" y="614" fill="#66FFFFFF" font-size="12">Тайминги переворота live-плитки Microsoft не публиковал и не давал контролировать («random interval»). Очередь = 5, FIFO.</text>

  <!-- ============ Win8 ============ -->
  <text x="520" y="96" fill="#1BA1E2" font-size="17" font-weight="600">WINDOWS 8.1 — px @100%</text>

  <rect x="520" y="120" width="70" height="70" fill="#00ABA9"/>
  <rect x="600" y="120" width="70" height="70" fill="#1BA1E2"/>
  <rect x="520" y="200" width="70" height="70" fill="#D80073"/>
  <rect x="600" y="200" width="70" height="70" fill="#60A917"/>
  <text x="528" y="146" fill="#FFFFFF" font-size="11" font-weight="600">70&#215;70</text>
  <text x="528" y="162" fill="#FFFFFF" font-size="10" opacity="0.7">8.1 only</text>

  <rect x="680" y="120" width="150" height="150" fill="#0050EF"/>
  <text x="692" y="146" fill="#FFFFFF" font-size="14" font-weight="600">150 &#215; 150</text>
  <text x="692" y="166" fill="#FFFFFF" font-size="11" opacity="0.75">Square150x150</text>
  <text x="692" y="184" fill="#FFFFFF" font-size="11" opacity="0.75">= 70 + 10 + 70</text>

  <rect x="520" y="290" width="310" height="150" fill="#FA6800"/>
  <text x="532" y="318" fill="#FFFFFF" font-size="14" font-weight="600">310 &#215; 150 — Wide310x150</text>
  <text x="532" y="338" fill="#FFFFFF" font-size="11" opacity="0.75">= 150 + 10 + 150 по ширине</text>

  <rect x="860" y="120" width="310" height="310" fill="#76608A"/>
  <text x="874" y="150" fill="#FFFFFF" font-size="15" font-weight="600">310 &#215; 310 — Square310x310</text>
  <text x="874" y="172" fill="#FFFFFF" font-size="12" opacity="0.75">новинка 8.1; в 8.0 были только</text>
  <text x="874" y="190" fill="#FFFFFF" font-size="12" opacity="0.75">150&#215;150 и 310&#215;150</text>
  <text x="874" y="418" fill="#FFFFFF" font-size="12" opacity="0.75">Плато масштаба: 80 / 100 / 140 / 180 %</text>

  <line x1="590" y1="112" x2="600" y2="112" stroke="#E51400" stroke-width="2"/>
  <text x="576" y="108" fill="#E51400" font-size="11">10</text>

  <text x="520" y="474" fill="#66FFFFFF" font-size="12">Шаг строки Start-экрана — 160 px «including padding» &#8594; зазор 10 px.</text>
  <text x="520" y="492" fill="#66FFFFFF" font-size="12">Фиксированные поля верх+низ 215 px, максимум 6 строк.</text>
  <text x="520" y="510" fill="#66FFFFFF" font-size="12">Любое изображение: &#8804; 1024&#215;1024 и &#8804; 200 KB.</text>
  <text x="520" y="528" fill="#66FFFFFF" font-size="12">Внутренние отступы плиток Win8/8.1 Microsoft не публиковал.</text>
  <text x="520" y="546" fill="#66FFFFFF" font-size="12">Опубликован только WP8.1: 71&#215;71 &#8594; 19,19 · 150&#215;150 &#8594; 45,45 · 310&#215;150 &#8594; 125,45.</text>

  <rect x="520" y="566" width="650" height="58" fill="#141414" stroke="#33FFFFFF"/>
  <text x="534" y="590" fill="#FFFFFF" font-size="13" font-weight="600">Для API</text>
  <text x="534" y="612" fill="#99FFFFFF" font-size="12" font-family="monospace">TileSize.Small / Medium / Wide / Large &#8594; DpSize; MetroTileGrid(columns, gap = 9.dp)</text>
</svg>
